<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greeting App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #1f2937;
    }
    .card {
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    h1 { margin: 0 0 20px; font-size: 22px; }
    label { display: block; text-align: left; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.25); }
    .error { color: #dc2626; font-size: 13px; text-align: left; min-height: 18px; margin: 6px 0 0; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
    }
    .submit-btn {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: #fff;
    }
    .submit-btn:hover { background: #4f46e5; }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: #fff;
      padding: 28px;
      border-radius: 16px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .modal p { font-size: 20px; margin: 0 0 20px; word-break: break-word; }
    .ok-btn { padding: 10px 24px; background: #6366f1; color: #fff; }
    .ok-btn:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome 👋</h1>
    <label for="nameInput">Enter your name</label>
    <input id="nameInput" type="text" placeholder="e.g. Sadeghian" autocomplete="off" />
    <p class="error" id="error"></p>
    <button type="button" class="submit-btn" id="submitBtn">Submit</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <p id="greeting"></p>
      <button type="button" class="ok-btn" id="okBtn">OK</button>
    </div>
  </div>

  <script>
    var nameInput = document.getElementById('nameInput');
    var submitBtn = document.getElementById('submitBtn');
    var error = document.getElementById('error');
    var overlay = document.getElementById('overlay');
    var greeting = document.getElementById('greeting');
    var okBtn = document.getElementById('okBtn');

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function showGreeting() {
      var name = nameInput.value.trim();
      if (!name) {
        error.textContent = 'Please enter your name.';
        nameInput.focus();
        return;
      }
      error.textContent = '';
      greeting.innerHTML = 'Hello ' + escapeHtml(name) + '!';
      overlay.classList.add('open');
    }

    function closeModal() {
      overlay.classList.remove('open');
      nameInput.focus();
    }

    submitBtn.addEventListener('click', showGreeting);
    okBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeModal();
    });
    nameInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') showGreeting();
    });
  </script>
</body>
</html>

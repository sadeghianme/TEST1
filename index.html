<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    :root {
      --purple-1: #6d28d9;
      --purple-2: #a855f7;
      --purple-deep: #4c1d95;
      --white: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: linear-gradient(135deg, var(--purple-deep), var(--purple-1) 50%, var(--purple-2));
      color: var(--white);
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 6px 24px rgba(0,0,0,0.35);
      animation: floatIn 0.8s ease both;
      background: linear-gradient(90deg, #fff, #e9d5ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .btn {
      cursor: pointer;
      border: none;
      border-radius: 50px;
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--purple-deep);
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 16px 40px rgba(0,0,0,0.35); }
    .btn:active { transform: translateY(0) scale(0.98); }
    .btn:focus-visible { outline: 3px solid #e9d5ff; outline-offset: 3px; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 10, 60, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .overlay.open { display: flex; animation: fadeIn 0.25s ease both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .dialog {
      position: relative;
      background: linear-gradient(160deg, #ffffff, #f5f0ff);
      color: var(--purple-deep);
      border-radius: 20px;
      padding: 36px 32px 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
      animation: popIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
      text-align: center;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.85) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .dialog h2 { font-size: 1.5rem; margin-bottom: 22px; color: var(--purple-1); }
    .dialog .actions { display: flex; gap: 14px; justify-content: center; }
    .dialog .actions button {
      cursor: pointer;
      border: none;
      border-radius: 50px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .dialog .actions button:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .btn-yes { background: linear-gradient(135deg, var(--purple-1), var(--purple-2)); color: #fff; }
    .btn-no { background: #ede9fe; color: var(--purple-deep); }
    .close-x {
      position: absolute;
      top: 12px;
      right: 16px;
      background: transparent;
      border: none;
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      color: #a78bda;
    }
    .close-x:hover { color: var(--purple-1); }
  </style>
</head>
<body>
  <h1>Hello World</h1>
  <button class="btn" id="openBtn">Click Me</button>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <div class="dialog">
      <button class="close-x" id="closeX" aria-label="Close">&times;</button>
      <h2 id="dialogTitle">Are you sure?</h2>
      <div class="actions">
        <button class="btn-yes" id="yesBtn">Yes</button>
        <button class="btn-no" id="noBtn">No</button>
      </div>
    </div>
  </div>

  <script>
    var overlay = document.getElementById('overlay');
    var openBtn = document.getElementById('openBtn');
    var yesBtn = document.getElementById('yesBtn');
    var noBtn = document.getElementById('noBtn');
    var closeX = document.getElementById('closeX');

    function openPopup() {
      overlay.classList.add('open');
      yesBtn.focus();
    }
    function closePopup() {
      overlay.classList.remove('open');
      openBtn.focus();
    }

    openBtn.addEventListener('click', openPopup);
    yesBtn.addEventListener('click', function () { location.reload(); });
    noBtn.addEventListener('click', closePopup);
    closeX.addEventListener('click', closePopup);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closePopup(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay.classList.contains('open')) closePopup();
    });
  </script>
</body>
</html>
